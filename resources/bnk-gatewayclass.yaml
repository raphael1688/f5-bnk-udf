apiVersion: k8s.f5.com/v1
kind: BNKGatewayClass
metadata:
  labels:
    app.kubernetes.io/name: f5-lifecycle-operator
    app.kubernetes.io/managed-by: kustomize
  name: bnkgatewayclass-sample
spec:
  manifestVersion: "2.1.0-3.1736.1-0.1.27"
  containerPlatform: Generic
  telemetry:
    loggingSubsystem:
      enabled: false
    metricSubsystem:
      enabled: true
  certificate:
    clusterIssuer: bnk-ca-cluster-issuer
  deploymentSize: "Small"
  image:
    repository: "repo.f5.com/images"
    imagePullSecrets:
    - name: far-secret
    imagePullPolicy: Always
  networkAttachments:
  - external-net
  - egress-net

  # Features
  # CSRC Egress
  pseudoCNI:
    enabled: true
  # BGP
  dynamicRouting:
    enabled: true
  # Core dump files
  coreCollection:
    enabled: false
  # AFM
  firewallACL:
    enabled: true

  advanced:
    demoMode:
      enabled: true
    maintenanceMode:
      enabled: false
    envDiscovery:
      enabled: false
      stopOnFail: true
      runAfterSuccess: true
    pseudoCNI:
      env:
      - name: "EXCLUDE_CIDR"
        value: "10.96.0.0/12,10.244.0.0/16,198.168.20.0/24,10.11.0.0/16"
    tmm:
      env:
      - name: "TMM_CALICO_ROUTER"
        value: "default"
      - name: "TMM_MAPRES_ADDL_VETHS_ON_DP"
        value: "TRUE"
    #  - name: "TMM_LOG_LEVEL"
    #    value: "Debug"
